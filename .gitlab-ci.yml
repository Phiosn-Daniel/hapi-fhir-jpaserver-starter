stages:
  - release
  - deploy
  - test

variables:
  CIFS_MOUNT_POINT: "/mnt/shared"
  CIFS_USERNAME: "ticagent"
  CIFS_PASSWORD: "cde#123"
  HAPI_FHIR_BRANCH: "ci-test"
  TESTS_NUMBER: 500

build-and-push-image-to-harbor:
  stage: release
  tags:
    - build
  variables:
    USER: root
  script:
    - |
      cp -r ~/.m2 m2-cache
      echo "========================================";
      echo "Building and Pushing with Git Tag";
      echo "========================================";
      echo "Git Tag: $GIT_TAG";
      echo "";
      export CI_COMMIT_TAG=$GIT_TAG;
      make git-tag-build;
      echo "";
      echo "========================================";
      echo "Release completed!";
      echo "========================================";
      echo "Image pushed to Harbor with tag: ${GIT_TAG}";
  only:
    - tags
    - web

auto-deploy-1:
  stage: deploy
  tags:
    - deploy-1
  script:
    - export VERSION=$(git describe --tags --always)
    - cd ~/cd
    - docker compose -f ${DOCKER_COMPOSE_FILE} down
    - docker compose -f ${DOCKER_COMPOSE_FILE} up -d
  only:
    - tags
    - web

auto-deploy-2:
  stage: deploy
  tags:
    - deploy-2
  script:
    - export VERSION=$(git describe --tags --always)
    - cd ~/cd
    - docker compose -f ${DOCKER_COMPOSE_FILE} down
    - docker compose -f ${DOCKER_COMPOSE_FILE} up -d
  only:
    - tags
    - web


auto-test:
  stage: test
  tags:
    - test
  script:
    - sleep 300
    - cd ~/fhir-server-performance-test-suite_oauth
    - java -cp target/synthea-bulk-loader.jar bulkload.Test01_LoadDataUsingTransactions /mnt/postgres/testdata/output/tests/${TESTS_NUMBER} "${END_POINTS}"  oauth-client.properties ${CLIENT_NUMBER} true
  only:
    - tags
    - web