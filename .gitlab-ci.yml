stages:
  - prepare  
  - release

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Xmx2g"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  CIFS_SHARE: "//172.23.99.220/tic/user/RC/hapi-fhir"
  CIFS_MOUNT_POINT: "/mnt/shared"
  HAPI_FHIR_BRANCH: "ci-test"
  CIFS_USERNAME: "ticagent"
  CIFS_PASSWORD: "cde#123"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

# 從共享資料夾下載依賴
download-hapi-dependencies:
  stage: prepare
  image: alpine:latest
  tags:
    - prepare
  before_script:
    - apk add --no-cache cifs-utils rsync bash
  script:
    - |
      echo "========================================";
      echo "Downloading HAPI FHIR dependencies";
      echo "========================================";

      mkdir -p $CIFS_MOUNT_POINT;

      # 掛載共享資料夾
      mount -t cifs "$CIFS_SHARE" $CIFS_MOUNT_POINT \
        -o username=$CIFS_USERNAME,password=$CIFS_PASSWORD,vers=3.0,ro;

      if ! mountpoint -q $CIFS_MOUNT_POINT; then
        echo "ERROR: Failed to mount CIFS share";
        exit 1;
      fi;

      echo "? Successfully mounted $CIFS_SHARE";

      LATEST_DIR="$CIFS_MOUNT_POINT/latest/$HAPI_FHIR_BRANCH";

      if [ ! -d "$LATEST_DIR/maven-repo" ]; then
        echo "ERROR: HAPI FHIR dependencies not found";
        exit 1;
      fi;

      if [ -f "$LATEST_DIR/build-info.txt" ]; then
        echo "";
        echo "========================================";
        echo "Using HAPI FHIR build:";
        echo "========================================";
        cat "$LATEST_DIR/build-info.txt";
        echo "========================================";
      fi;

      echo "Downloading dependencies...";
      mkdir -p .m2/repository/ca/uhn/hapi/fhir;

      rsync -av --progress \
        "$LATEST_DIR/maven-repo/" \
        .m2/repository/ca/uhn/hapi/fhir/;

      DOWNLOADED_SIZE=$(du -sh .m2/repository/ca/uhn/hapi/fhir | cut -f1);
      FILE_COUNT=$(find .m2/repository/ca/uhn/hapi/fhir -type f | wc -l);

      echo "Downloaded $FILE_COUNT files, total size: $DOWNLOADED_SIZE";

      umount $CIFS_MOUNT_POINT;
      echo "Unmounted CIFS share";
  cache:
    key: "hapi-fhir-deps-${HAPI_FHIR_BRANCH}"
    paths:
      - .m2/repository/ca/uhn/hapi/fhir/
    policy: push
  only:
    - main
    - develop
    - tags
    - web

release-tag:
  stage: release
  image: 
    name: docker:28-dind
    pull_policy: if-not-present
  tags:
    - release
  services:
    - name: docker:28-dind
      pull_policy: if-not-present
  variables:
    DOCKER_HOST: tcp://docker:2376/
    DOCKER_TLS_CERTDIR: "/certs"
    HARBOR_HOST: "habor.phison.com"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    # 安裝必要工具
    - apk add --no-cache make git bash maven openjdk17 ca-certificates
    - mkdir -p /etc/docker/certs.d/${HARBOR_HOST}
    - cp $HARBOR_CA_CERT /etc/docker/certs.d/${HARBOR_HOST}/ca.crt
    - cp $HARBOR_CA_CERT /usr/local/share/ca-certificates/harbor.crt
    - cp $HARBOR_CA_CERT {DOCKER_CERT_PATH}/harbor.crt
    - update-ca-certificates
    #- ls -la /etc/docker/certs.d/${HARBOR_HOST}/

    #- cp $DOCKER_CA_CERT /certs/client/ca.pem
    #- systemctl daemon-reexec
    #- systemctl restart docker
    #- docker info
    #- docker version
    #- cat /etc/docker/certs.d/${HARBOR_HOST}/ca.crt

    # 使用 git describe 獲取標籤
    - export GIT_TAG=$(git describe --tags --always)
    - |
      echo "Git Tag from describe: $GIT_TAG"
    # 檢查是否成功獲取標籤
    - |
      if [ -z "$GIT_TAG" ]; then
        echo "ERROR: Failed to get git tag";
        exit 1;
      fi
  script:
    - update-ca-certificates
    - |
      echo "========================================";
      echo "Building and Pushing with Git Tag";
      echo "========================================";
      echo "Git Tag: $GIT_TAG";
      echo "";
      # 將 GIT_TAG 傳遞給 Makefile
      # 你需要確保 Makefile 能接收這個變數
      export CI_COMMIT_TAG=$GIT_TAG;
      make git-tag-build;
      echo "";
      echo "========================================";
      echo "Release completed!";
      echo "========================================";
      echo "Image pushed to Harbor with tag: ${GIT_TAG}";
  cache:
    key: "hapi-fhir-deps-${HAPI_FHIR_BRANCH}"
    paths:
      - .m2/repository/ca/uhn/hapi/fhir/
    policy: pull
  only:
    - develop
    - web
