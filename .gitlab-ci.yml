stages:
  - release
  - deploy
  - test

variables:
  CIFS_MOUNT_POINT: "/mnt/shared"
  CIFS_USERNAME: "ticagent"
  CIFS_PASSWORD: "cde#123"
  HAPI_FHIR_BRANCH: "ci-test"
  TESTS_NUMBER: 500

build-and-push-image-to-harbor:
  stage: release
  tags:
    - build
  variables:
    USER: root
  script:
    - |
      echo "========================================";
      echo "Downloading HAPI FHIR dependencies";
      echo "========================================";

      LATEST_DIR="$CIFS_MOUNT_POINT/latest/$HAPI_FHIR_BRANCH";
      if [ -f "$LATEST_DIR/build-info.txt" ]; then
        echo "";
        echo "========================================";
        echo "Using HAPI FHIR build:";
        echo "========================================";
        cat "$LATEST_DIR/build-info.txt";
        echo "========================================";
      fi;

      echo "Downloading dependencies...";
      mkdir -p ~/.m2/repository/ca/uhn/hapi/fhir;

      rsync -av --progress \
        "$LATEST_DIR/maven-repo/" \
        ~/.m2/repository/ca/uhn/hapi/fhir/;

      DOWNLOADED_SIZE=$(du -sh ~/.m2/repository/ca/uhn/hapi/fhir | cut -f1);
      FILE_COUNT=$(find ~/.m2/repository/ca/uhn/hapi/fhir -type f | wc -l);

      echo "Downloaded $FILE_COUNT files, total size: $DOWNLOADED_SIZE";
      export GIT_TAG=$(git describe --tags --always)
      echo "Git Tag from describe: $GIT_TAG"
      
      echo "========================================";
      echo "Building and Pushing with Git Tag";
      echo "========================================";
      echo "Git Tag: $GIT_TAG";
      echo "";
      export CI_COMMIT_TAG=$GIT_TAG;
      make git-tag-build;
      echo "";
      echo "========================================";
      echo "Release completed!";
      echo "========================================";
      echo "Image pushed to Harbor with tag: ${GIT_TAG}";
  only:
    - tags
    - web

auto-deploy-1:
  stage: deploy
  tags:
    - deploy-1
  script:
    - export VERSION=$(git describe --tags --always)
    - cd ~/cd
    - docker compose down
    - docker compose up -d
  only:
    - tags
    - web

auto-deploy-2:
  stage: deploy
  tags:
    - deploy-2
  script:
    - export VERSION=$(git describe --tags --always)
    - cd ~/cd
    - docker compose down
    - docker compose up -d
  only:
    - tags
    - web


auto-test:
  stage: test
  tags:
    - test
  script:
    - cd ~/fhir-server-performance-test-suite
    - java -cp target/synthea-bulk-loader.jar bulkload.Test01_LoadDataUsingTransactions output/tests/${TESTS_NUMBER} "http://192.168.197.205:8081/fhir,http://192.168.197.205:8080/fhir" "admin:admin" 100 true
  only:
    - tags
    - web